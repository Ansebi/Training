<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training CMD</title>
<style>
body {
    background:radial-gradient(#06150b,#010402 75%);
    color:#39ff65;
    font:16px/1.45 "Courier New",monospace;
    padding:20px;
    text-shadow:0 0 6px currentColor;
    animation:flicker 5s infinite;
}
body::after {
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(0deg,#0004 0 1px,transparent 1px 3px);
}
#terminal {
    max-width:900px;
    min-height:85vh;
    margin:auto;
    padding:22px;
    border:1px solid #17602d;
    border-radius:6px;
    background:#041009cc;
    box-shadow:0 0 40px #0b2a14,inset 0 0 60px #000a;
}
#output {white-space:pre-wrap;overflow-wrap:anywhere}
#entry {display:flex;gap:10px;margin-top:8px}
#prompt {white-space:pre}
input {
    flex:1;min-width:0;border:0;outline:0;
    background:transparent;color:inherit;
    font:inherit;text-shadow:inherit;
    caret-color:#39ff65;caret-shape:block;
}
::selection {background:#39ff65;color:#000;text-shadow:none}
.good {color:#a0ffad}
.bad {color:#ff8585}
@keyframes flicker {0%,100%{opacity:1} 50%{opacity:.96} 52%{opacity:1} 90%{opacity:.98}}
@media (prefers-reduced-motion:reduce) {body{animation:none}}
</style>
</head>
<body>
<div id="terminal">
    <div id="output"></div>
    <div id="entry">
        <span id="prompt">&gt;</span>
        <input id="cmd" autocomplete="off" spellcheck="false" autofocus>
    </div>
</div>

<script>
(() => {
"use strict";

window.TrainingExercises = window.TrainingExercises || {};

function add_negatives(difficulty) {
    const P = window.TrainingPy;
    let right_answers, input_message, prompt;

    const n = P.randint(10, 100);
    const n_sign = P.randint(0, 1) === 1 ? -1 : 1;

    const m = P.randint(10, 100);
    const m_sign = P.randint(0, 1) === 1 ? -1 : 1;

    let right_answer = n * n_sign + m * m_sign;
    right_answer = String(right_answer);
    right_answers = [right_answer];
    input_message = m_sign === 1
        ? String(n * n_sign) + "+" + String(m * m_sign) + " = "
        : String(n * n_sign) + String(m * m_sign) + " = ";

    return { right_answers, input_message, prompt };
}

window.TrainingExercises.add_negatives = add_negatives;
})();

(() => {
"use strict";

window.TrainingExercises = window.TrainingExercises || {};

function find_sum(difficulty) {
    const P = window.TrainingPy;
    let right_answers, input_message, prompt;

    input_message = "";
    let right_answer = 0;

    const n = [], n_quantity = [], input_message_raw = [];
    for (let i = 0; i < 3; i++) {
        n.push(P.randint(-50, 50));
        n_quantity.push(P.randint(0, 6));
        right_answer += n[i] * n_quantity[i];
        for (let counter = 0; counter < n_quantity[i]; counter++) {
            input_message_raw.push(n[i]);
        }
        P.shuffle(input_message_raw);
    }
    for (let counter = 0; counter < input_message_raw.length; counter++) {
        input_message += " " + String(input_message_raw[counter]) + " ";
    }
    input_message = "sum(" + input_message + ")= ";
    right_answers = [String(right_answer)];

    return { right_answers, input_message, prompt };
}

window.TrainingExercises.find_sum = find_sum;
})();

(() => {
"use strict";

window.TrainingExercises = window.TrainingExercises || {};

function multiplication_table(difficulty) {
    const P = window.TrainingPy;
    let right_answers, input_message, prompt;

    // n*m
    const n = P.randint(1, 11);
    const m = P.randint(1, 11);
    const right_answer = n * m;
    right_answers = [String(right_answer)];
    input_message = String(n) + " * " + String(m) + " = ";

    return { right_answers, input_message, prompt };
}

window.TrainingExercises.multiplication_table = multiplication_table;
})();

(() => {
"use strict";

window.TrainingExercises = window.TrainingExercises || {};

function multiply_decimals(difficulty) {
    const P = window.TrainingPy;
    let right_answers, input_message, prompt;

    const n_sign = P.randint(0, 1) === 1 ? -1 : 1;

    // np.random.randint(0, 9, size) -> digits 0..8; int("".join(...))
    // size < 0 or size == 0 raises in Python (numpy ValueError / int("") ValueError)
    function random_digits_to_int(size) {
        if (size < 0) throw new Error("negative dimensions are not allowed");
        let s = "";
        for (let i = 0; i < size; i++) s += String(P.randint(0, 8));
        if (s === "") throw new Error("invalid literal for int() with base 10: \x27\x27");
        return parseInt(s, 10);
    }
    // 10 ** randint(-3, -1) in Python is a float
    const POW10_NEG = { "-3": 0.001, "-2": 0.01, "-1": 0.1 };

    const whole_part_n = random_digits_to_int(difficulty + P.choice([0, -1]));
    const whole_part_m = random_digits_to_int(difficulty + P.choice([0, -1]));

    const n = P.round(whole_part_n * POW10_NEG[String(P.randint(-3, -1))], 4);
    const m = P.round(whole_part_m * POW10_NEG[String(P.randint(-3, -1))], 4);

    let right_answer = P.round(n_sign * n * m, 4);
    let is_int = false;
    if (!(right_answer % 1)) {
        right_answer = Math.trunc(right_answer);
        is_int = true;
    }
    if (!right_answer && n_sign < 0) {
        right_answer = 0;
        is_int = true;
    }
    right_answers = [is_int ? String(right_answer) : P.floatStr(right_answer)];
    input_message = P.floatStr(n * n_sign) + " * " + P.floatStr(m) + " = ";

    return { right_answers, input_message, prompt };
}

window.TrainingExercises.multiply_decimals = multiply_decimals;
})();

(() => {
"use strict";

window.TrainingExercises = window.TrainingExercises || {};

function multiply_hundreds(difficulty) {
    const P = window.TrainingPy;
    let right_answers, input_message, prompt;

    // 26.05.2018 edition
    let m = 1, n = 1;
    if (P.choice([0, 0, 1, 1, 1]) === 0) {
        n = P.randint(0, 13) * 10 ** P.randint(0, 4);
        m = P.randint(1, 13) * 10 ** P.randint(0, 4);
    } else {
        while (m * n % 10 !== 0) {
            n = P.choice([P.randint(2, 9), P.randint(11, 13)]);
            m = P.choice([P.randint(2, 9), P.randint(11, 13)]);
        }
    }
    n = n * 10 ** P.randint(0, 4);
    m = m * 10 ** P.randint(0, 4);
    const n_sign = P.choice([-1, 1]);
    const m_sign = P.choice([-1, 1]);

    const right_answer = n_sign * n * m_sign * m;
    right_answers = [String(right_answer)];
    input_message = m_sign === 1
        ? String(n * n_sign) + " * " + String(m) + " = "
        : String(n * n_sign) + " * (" + String(m * m_sign) + ") = ";

    return { right_answers, input_message, prompt };
}

window.TrainingExercises.multiply_hundreds = multiply_hundreds;
})();

(() => {
"use strict";

window.TrainingExercises = window.TrainingExercises || {};

function multiply_two_digits(difficulty) {
    const P = window.TrainingPy;
    let right_answers, input_message, prompt;

    // n * m
    const n = P.randint(10, 100);
    const m = P.randint(2, 11);
    const right_answer = n * m;
    right_answers = [String(right_answer)];
    input_message = String(n) + " * " + String(m) + " = ";

    return { right_answers, input_message, prompt };
}

window.TrainingExercises.multiply_two_digits = multiply_two_digits;
})();

(() => {
"use strict";

window.TrainingExercises = window.TrainingExercises || {};

function round_decimals(difficulty) {
    const P = window.TrainingPy;
    let right_answers, input_message, prompt;

    // random.uniform(a, b) == a + (b - a) * random()
    const n = P.round(-1000 + (1000 - -1000) * Math.random(), P.randint(5, 7));
    const dp = P.randint(0, 4);
    let right_answer = P.round(n, dp);
    if (!dp) {
        right_answer = String(Math.trunc(right_answer));   // int(...)
    } else {
        right_answer = P.floatStr(right_answer);
    }
    right_answers = [right_answer];
    // Python: 10 ** (-dp) is int 1 for dp == 0, float otherwise
    const step = dp === 0 ? "1" : P.floatStr(Math.pow(10, -dp));
    input_message = P.floatStr(n) + " rounded by " + step + "(" + String(dp) + " d.p.) = ";

    return { right_answers, input_message, prompt };
}

window.TrainingExercises.round_decimals = round_decimals;
})();

(() => {
"use strict";

window.TrainingExercises = window.TrainingExercises || {};

function round_whole_numbers(difficulty) {
    const P = window.TrainingPy;
    let right_answers, input_message, prompt;

    const n = P.randint(1, 1000000);
    const n_sign = P.randint(0, 1) === 1 ? -1 : 1;

    const m = 10 ** P.randint(1, 5);
    let right_answer = n_sign * Math.trunc(P.round(n / m, 0) * m);
    right_answer = String(right_answer);
    right_answers = [right_answer];
    input_message = String(n * n_sign) + " rounded by " + String(m) + " = ";

    return { right_answers, input_message, prompt };
}

window.TrainingExercises.round_whole_numbers = round_whole_numbers;
})();

(() => {
"use strict";

window.TrainingExercises = window.TrainingExercises || {};

function test(difficulty) {
    const P = window.TrainingPy;
    let right_answers, input_message, prompt;

    const right_answer = "test";
    right_answers = [right_answer];
    input_message = "test: ";

    return { right_answers, input_message, prompt };
}

window.TrainingExercises.test = test;
})();
(() => {
"use strict";

const output=document.querySelector("#output");
const cmd=document.querySelector("#cmd");
const promptEl=document.querySelector("#prompt");

const EXIT=["bye","see ya","exit","goodbye","hasta la vista",
"farewell","dosviduli","off","finish","gg","home",
"i am batman","i'll be back","nooooo"];

// Injected by assemble.py from the enabled src/config/*.json files.
const exercises=[{"id": "add_negatives", "name": "Add negatives", "subjects": ["maths"]}, {"id": "find_sum", "name": "Find sum", "subjects": ["maths"]}, {"id": "multiplication_table", "name": "Multiplication Table", "subjects": ["maths"]}, {"id": "multiply_decimals", "name": "Multiply decimals", "subjects": ["maths"]}, {"id": "multiply_hundreds", "name": "Multiply hundreds", "subjects": ["maths"]}, {"id": "multiply_two_digits", "name": "Multiply two digits", "subjects": ["maths"]}, {"id": "round_decimals", "name": "Round decimals", "subjects": ["maths"]}, {"id": "round_whole_numbers", "name": "Round whole numbers", "subjects": ["maths"]}, {"id": "test", "name": "Test", "subjects": ["english"]}];
const subjects=[...new Set(exercises.flatMap(e=>e.subjects))].sort();
const label=s=>s.charAt(0).toUpperCase()+s.slice(1);

let state="boot",handler=null;
let user=localStorage.getItem("training.lastUser")||"";
let exercise="",exerciseId="",subject="",mode=1,target=15,difficulty=0;
let correct=0,wrong=0,started=0,question=null,task=0,score=0;
let audio=null;

// ---------------------------------------------------------------
// CORE MODULES (src/core/<name>.js)
// ---------------------------------------------------------------
// ---- core/pycompat.js ----
(() => {
"use strict";

// Python-compatible helpers so converted exercises keep Python's exact behaviour.
// Exercises must call these lazily (inside the exercise function), via window.TrainingPy.

// random.randint(a, b): inclusive on both ends
function randint(a, b) {
    return Math.floor(Math.random() * (b - a + 1)) + a;
}

// random.choice(list)
function choice(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

// random.shuffle(list): in place, same algorithm as CPython
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
}

// round(x, ndigits) for ndigits >= 0 and float x: exact-value rounding, ties to even
// (Math.round rounds ties up and works on x * 10^n, so it differs from Python)
function round(x, nd = 0) {
    if (!Number.isFinite(x) || x === 0 || Math.abs(x) >= 1e21) return x; // keeps -0
    if (Number.isInteger(x * Math.pow(2, nd + 1))) {
        // x is exactly representable with nd+1 decimals, so toFixed(nd+1) is exact
        const s = x.toFixed(nd + 1);
        if (s.endsWith("5")) {                       // exact tie -> round half to even
            const neg = s[0] === "-";
            const digits = s.replace("-", "").replace(".", "").slice(0, -1);
            let q = BigInt(digits);
            if (q % 2n === 1n) q += 1n;
            const t = q.toString().padStart(nd + 1, "0");
            const res = nd > 0 ? t.slice(0, -nd) + "." + t.slice(-nd) : t;
            return Number((neg ? "-" : "") + res);
        }
    }
    return Number(x.toFixed(nd));                    // non-tie: correctly rounded
}

// str(x) for a Python float (repr): "3.0", "-0.0", "1e-05", ...
function floatStr(x) {
    if (Number.isNaN(x)) return "nan";
    if (!Number.isFinite(x)) return x > 0 ? "inf" : "-inf";
    if (Object.is(x, -0)) return "-0.0";
    if (x === 0) return "0.0";
    const [mant, expStr] = x.toExponential().split("e");
    const e = parseInt(expStr, 10);
    if (e < -4 || e >= 16) {
        return mant + "e" + (e < 0 ? "-" : "+") + String(Math.abs(e)).padStart(2, "0");
    }
    const s = String(x);
    return s.includes(".") ? s : s + ".0";
}

window.TrainingPy = { randint, choice, shuffle, round, floatStr };
})();

// ---- core/terminal.js ----
// TERMINAL

function clearScreen() {
    output.innerHTML="";
}

function say(text="",cls="") {
    const d=document.createElement("div");
    d.textContent=text;
    if(cls)d.className=cls;
    output.append(d);
    window.scrollTo(0,document.body.scrollHeight);
}

function blank(){say()}

function setPrompt(text="> ") {
    promptEl.textContent=text;
    cmd.value="";
    cmd.disabled=false;
    cmd.focus();
}

function ask(message,fn) {
    say(message);
    handler=fn;
    setPrompt();
}

// ---- core/sound.js ----
// SOUND

function beep(freq,duration,delay=0) {
    try {
        const C=window.AudioContext||window.webkitAudioContext;
        if(!C)return;

        audio ||= new C();
        if(audio.state==="suspended")audio.resume();

        const oscillator=audio.createOscillator();
        const gain=audio.createGain();
        const t=audio.currentTime+delay/1000;

        oscillator.type="square";
        oscillator.frequency.value=freq;
        gain.gain.setValueAtTime(5.,t);
        gain.gain.exponentialRampToValueAtTime(
            .001,t+duration/1000
        );

        oscillator.connect(gain);
        gain.connect(audio.destination);
        oscillator.start(t);
        oscillator.stop(t+duration/1000);
    } catch(e){}
}

function successSound() {
    beep(900,200);
    beep(1100,150,95);
}

function failureSound() {
    beep(200,400);
    beep(170,450,320);
    beep(120,1200,750);
}

// ---- core/ascii.js ----
// ASCII

function yay() {
    successSound();
    say("      **   **","good");
    say("      **   **","good");
    say("");
    say("    *         *","good");
    say("     *       *","good");
    say("      *******","good");
}

function boo() {
    failureSound();
    say("     * *   * *","bad");
    say("      *     *","bad");
    say("     * *   * *","bad");
    say("");
    say("      *******","bad");
    say("     *       *","bad");
    say("    *         *","bad");
}

// ---- core/maths.js ----
// MATHS

function rand(a,b) {
    return Math.floor(Math.random()*(b-a+1))+a;
}

function gcd(a,b) {
    while(b)[a,b]=[b,a%b];
    return Math.abs(a);
}

function makeQuestion() {
    const exerciseFunction = window.TrainingExercises && window.TrainingExercises[exerciseId];
    if (!exerciseFunction) {
        throw new Error(`Exercise module not found: ${exerciseId}`);
    }
    const result = exerciseFunction(difficulty);
    return {
        answers: [].concat(result.right_answers).map(String),
        text: result.input_message
    };
}

// ---- core/scoring.js ----
// SCORING

function accuracy() {
    return correct+wrong
        ?Math.round(correct/(correct+wrong)*1000)/10
        :0;
}

function getScore() {
    const seconds=Math.max(1,Math.floor((Date.now()-started)/1000));
    const speed=5*correct/seconds;

    return Math.round(
        (correct**2-wrong**2)*
        (accuracy()/100)**2*speed
    );
}

function stats() {
    score=getScore();
    const seconds=Math.floor((Date.now()-started)/1000);
    say(`points: ${score}       accuracy: ${accuracy()}%`);
    say(`time: ${Math.floor(seconds/60)}m ${seconds%60}s`);
}

// ---- core/training.js ----
// TRAINING

function begin() {
    clearScreen();

    correct=0;
    wrong=0;
    score=0;
    task=0;
    started=Date.now();

    say(`TRAINING: ${exercise}`,"good");
    say(`Difficulty: ${difficulty||"Normal"}`);
    nextQuestion();
}

function nextQuestion() {
    if(mode===1&&task>=target)return finish();
    if(mode===2&&(Date.now()-started)/1000>=target)return finish();
    if(mode===3&&getScore()>=target)return finish();

    // Clear the previous question and its feedback.
    clearScreen();

    task++;
    question=makeQuestion();

    stats();
    blank();

    if(mode===1)say(`tasks complete: ${task-1}/${target}`);

    if(mode===2) {
        const r=Math.max(0,target-Math.floor((Date.now()-started)/1000));
        say(`time remaining: ${Math.floor(r/60)}:${String(r%60).padStart(2,"0")}`);
    }

    if(mode===3)say(`target score: ${target}`);

    say(question.text);
    state="answer";
    handler=null;
    setPrompt();
}

function submitAnswer(value) {
    if(EXIT.includes(value.toLowerCase()))return finish();

    if(question.answers.includes(value.trim())) {
        correct++;
        say("Yeap — well done :)","good");
        yay();
    } else {
        wrong++;
        say("Nope.","bad");
        boo();
        say(`Your answer: ${value}`);
        say(`The correct answer is: ${question.answers.join(" or ")}`,"good");
    }

    stats();
    blank();
    say("Press ENTER for next task");

    state="between";
    handler=null;
    setPrompt();
}

// ---- core/results.js ----
// RESULTS

function finish() {
    clearScreen();

    const seconds=Math.floor((Date.now()-started)/1000);
    score=getScore();

    say("========== TRAINING RESULTS ==========","good");
    say(exercise);
    say(`${accuracy()}% accuracy`);
    say(`${Math.floor(seconds/60)} min ${seconds%60} sec`);
    say(`${correct} correct, ${wrong} incorrect`);
    say(`Your score: ${score}`,"good");
    blank();

    const history=JSON.parse(
        localStorage.getItem("training.history")||"[]"
    );

    history.push({
        date:new Date().toISOString(),
        user,exercise,difficulty,seconds,
        correct,wrong,accuracy:accuracy(),score
    });

    localStorage.setItem(
        "training.history",
        JSON.stringify(history.slice(-300))
    );

    say("Session saved in this browser.");
    say("Press ENTER to return to the menu.");

    state="return";
    handler=null;
    setPrompt();
}

// ---- core/menus.js ----

// MENUS

const random = arr => arr[Math.floor(Math.random()*arr.length)];

function menuSubject() {
    clearScreen();
    state="subject";

    say(`Welcome, ${user}.`);
    say("Available subjects:");
    subjects.forEach((s,i)=>say(`${i+1}. ${label(s)}`));

    ask("Choose subject: ",v=>{
        const n=Number(v);
        subject=Number.isInteger(n)&&n>=1&&n<=subjects.length
            ?subjects[n-1]
            :subjects.includes(v.trim().toLowerCase())
                ?v.trim().toLowerCase()
                :random(subjects);

        say(`Selected: ${label(subject)}`);
        menuExercise();
    });
}

function menuExercise() {
    clearScreen();
    state="exercise";

    const available=exercises.filter(e=>e.subjects.includes(subject));

    say(`${label(subject)} exercises:`);
    available.forEach((e,i)=>say(`${i+1}. ${e.name}`));

    ask("Choose exercise (random if empty/invalid): ",v=>{
        const n=Number(v);
        const picked=Number.isInteger(n)&&n>=1&&n<=available.length
            ?available[n-1]
            :available.find(e=>e.name.toLowerCase()===v.trim().toLowerCase())
                ||random(available);

        exercise=picked.name;
        exerciseId=picked.id;
        menuDifficulty();
    });
}

function menuDifficulty() {
    clearScreen();

    say(`Selected: ${exercise}`);
    say('Difficulty: set 1–4 (default: Normal)');
    say("1. Fixed number of tasks");
    say("2. Fixed time");
    say("3. Target score");

    ask("Training mode (random if empty/invalid): ",v=>{
        if(/^set\s+\d+$/i.test(v)) {
            difficulty=Math.max(1,Math.min(4,Number(v.split(/\s+/)[1])));
            say(`Difficulty: ${difficulty}`);
            return menuDifficulty();
        }

        mode=["1","2","3"].includes(v.trim())
            ?Number(v.trim())
            :1+Math.floor(Math.random()*3);

        const defaults={1:15,2:1,3:100};
        const messages={
            1:"Number of tasks",
            2:"Time in minutes",
            3:"Target score"
        };

        ask(`${messages[mode]} (default ${defaults[mode]}): `,v=>{
            const n=Number(v.trim());
            const valid=v.trim()!==""&&Number.isFinite(n)&&n>0;

            const value=valid?n:defaults[mode];
            target=mode===2?value*60:value;

            begin();
        });
    });
}

// ---- core/start.js ----
// START

function boot() {
    clearScreen();

    say("TRAINING CMD");
    say("============");
    say("A little practice. A little pressure.");
    blank();

    ask(
        user
            ?`Welcome back, ${user}. Press ENTER or enter a new name: `
            :"Sign in with your name: ",
        v=>{
            if(v.trim())user=v.trim();
            if(!user)user="Fighter";

            localStorage.setItem("training.lastUser",user);
            menuSubject();
        }
    );
}



// INPUT

cmd.addEventListener("keydown",event=>{
    if(event.key!=="Enter")return;

    event.preventDefault();

    const value=cmd.value;
    say(promptEl.textContent+value);

    cmd.value="";
    cmd.disabled=true;

    if(handler) {
        const fn=handler;
        handler=null;
        fn(value);
        return;
    }

    if(state==="answer")submitAnswer(value);
    else if(state==="between")nextQuestion();
    else if(state==="return")menuSubject();
});

boot();

})();
</script>
</body>
</html>
